<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Tech</title>
    <link rel="stylesheet" href="Loja.css">
</head>
<body>
    <script src="https://kit.fontawesome.com/a9bfb1bb20.js" crossorigin="anonymous"></script>

    <header>
        <div>
            <h1>Loja Tech</h1>
            <p>Sua loja de tecnologia que não te abandona</p>
        </div>
    </header>

    <main>
        <section class="lateral">
            <div class="bloco-lateral">
			
			<div>
                <p><i class="fa-solid fa-arrow-right"></i> Visite-nos em outras plataformas</p>
			</div>
			
			<div>
                <ul>
                    <li><a><i class="fa-brands fa-youtube"></i></a></li>
                    <li><a><i class="fa-brands fa-instagram"></i></a></li>
                    <li><a><i class="fa-brands fa-tiktok"></i></a></li>
                </ul>
			</div>
			
            </div>

            <div class="bloco-lateral">
                <p><b>BLACK FRIDAY</b></p>
                <p>Todos os produtos a partir de <span>R$30</span></p>
            </div>
        </section>
		
        <section class="principal">
                <div class="bloco">
                    <p>Celulares</p>
                </div>

                <div class="bloco">
                    <p>Notebooks, PCs e peças de computador</p>
                </div>

                <div class="bloco">
                    <p>Periféricos</p>
                </div>
        </section>
    </main>
</body>
</html>
